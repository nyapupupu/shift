<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="シフト給料">
  <title>シフト給料</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><h1 id="title">カレンダー</h1></header>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-tab="calendar" class="active"><span class="ico">📅</span>カレンダー</button>
    <button data-tab="month"><span class="ico">💴</span>月収</button>
    <button data-tab="year"><span class="ico">📊</span>年収</button>
    <button data-tab="settings"><span class="ico">⚙️</span>設定</button>
  </nav>
  <div id="sheet-backdrop" class="backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
